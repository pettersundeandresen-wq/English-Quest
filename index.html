<style>

 .line button:disabled{opacity:.4}.detail .example{font-size:17px;font-weight:650;margin-top:9px}.muted{font-size:12px;color:#687e71}.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#fff9e9;color:#23483b;padding:11px 17px;border-radius:14px;box-shadow:0 7px 30px #0006;z-index:20;font-weight:800;pointer-events:none;opacity:0;transition:opacity .15s;max-width:90vw;text-align:center}.toast.show{opacity:1}.legend{font-size:12px;color:#cfe2d6;text-align:center;margin:6px 0 0}.mini{font-size:12px;color:#627b70}.progress{height:9px;background:#dce8da;border-radius:9px;overflow:hidden;margin:9px 0}.progress span{display:block;height:100%;background:#2e9c71}.tag{background:#e2f1e5;padding:4px 9px;border-radius:20px;font-size:12px;font-weight:750}.finish{font-size:19px;text-align:center;background:#e8f4e9;padding:12px;border-radius:12px}.hidden{display:none!important}@media(max-width:600px){header{padding:8px 10px 5px}h1{font-size:17px}header .stats{font-size:13px;gap:7px}header button{padding:8px;font-size:13px}main{padding:0 7px 10px}.gamebox{border-width:2px}canvas{aspect-ratio:1/1}.pad{grid-template-columns:repeat(3,45px);grid-template-rows:repeat(3,39px)}.action{padding:10px;min-height:50px;font-size:13px}.message{font-size:11px}.panel{padding:15px}.bookgrid{grid-template-columns:repeat(4,1fr)}.question{font-size:18px}.hud{margin:5px 0}}

<header><h1>🗺️ English Quest <span style="font-size:11px;color:#b4dfca">2.0</span></h1><div class="stats"><span>🪙 <span id="coinCount">0</span></span><span>📖 <span id="wordCount">0</span>/20</span></div><button id="bookButton">📖 Ordbok</button></header>
<main><div class="gamebox"><canvas id="game" width="800" height="500" aria-label="Eventyrverden med avatar, skatter og engelske oppgaver"></canvas></div><div class="hud"><span class="hint" id="hint">Utforsk verden og finn nye ord!</span><span class="hint" id="keys">🔑 0/3</span></div><div class="controls"><div class="pad" aria-label="Styr figuren"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="right" data-dir="right">▶</button><button class="down" data-dir="down">▼</button></div><div class="message" id="message">Gå bort til en kiste, krystall, rune eller klokke.</div><button class="action" id="interact">✨ Åpne</button></div><div class="legend">🎁 Ord · 💎 Grammatikk · 🪨 Staving · 🔔 Lytting · 🌀 Mesterprøve</div></main>
<div class="toast" id="toast"></div>
<div class="overlay" id="overlay"><section class="panel" role="dialog" aria-modal="true"><div class="panelhead"><h2 id="modalTitle"></h2><button class="close" id="closeModal">✕</button></div><div id="modalBody"></div></section></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');
const VOCAB=[
['run','løpe','runs','I run fast.','Jeg løper fort.'],['like','like','likes','I like dogs.','Jeg liker hunder.'],['have','ha','has','I have a dog.','Jeg har en hund.'],['play','leke / spille','plays','We play football.','Vi spiller fotball.'],['walk','gå til fots','walks','I walk home.','Jeg går hjem.'],['jump','hoppe','jumps','I can jump high.','Jeg kan hoppe høyt.'],['dance','danse','dances','We dance together.','Vi danser sammen.'],['eat','spise','eats','I eat bread.','Jeg spiser brød.'],['sleep','sove','sleeps','I sleep at night.','Jeg sover om natten.'],['swim','svømme','swims','I can swim.','Jeg kan svømme.'],['watch','se på','watches','We watch TV.','Vi ser på TV.'],['wash','vaske','washes','I wash my hands.','Jeg vasker hendene mine.'],['go','gå / dra','goes','I go to school.','Jeg går på skolen.'],['study','studere / øve','studies','I study English.','Jeg øver på engelsk.'],['cry','gråte','cries','I cry sometimes.','Jeg gråter noen ganger.'],['try','prøve','tries','I try again.','Jeg prøver igjen.'],['fly','fly','flies','Birds fly high.','Fugler flyr høyt.'],['carry','bære','carries','I carry a bag.','Jeg bærer en veske.'],['enjoy','nyte / like','enjoys','I enjoy music.','Jeg liker musikk.'],['can','kan','can','I can sing.','Jeg kan synge.']].map((a,i)=>({id:i,w:a[0],no:a[1],third:a[2],sentence:a[3],nor:a[4]}));
const SAVE='english-quest-v2-local-1';let state={coins:0,found:[],mastery:{},completed:[],keys:0,player:{x:120,y:300},collected:[]};try{const saved=JSON.parse(localStorage.getItem(SAVE)||'null');if(saved&&Array.isArray(saved.found)){state={...state,...saved,player:{...state.player,...saved.player}}}}catch(e){}
const save=()=>{try{localStorage.setItem(SAVE,JSON.stringify(state))}catch(e){}};
const W=800,H=500,player=state.player;let modal=null,challenge=null,answered=false,toastTimer=null,near=null,frame=0;const keysDown=new Set();
const objects=[
{x:145,y:145,type:'chest',id:0},{x:340,y:140,type:'chest',id:1},{x:550,y:112,type:'chest',id:2},{x:675,y:185,type:'chest',id:3},{x:180,y:365,type:'chest',id:4},{x:400,y:365,type:'chest',id:5},{x:610,y:365,type:'chest',id:6},{x:750,y:350,type:'chest',id:7},
{x:260,y:255,type:'crystal',id:8},{x:490,y:225,type:'crystal',id:9},{x:715,y:445,type:'crystal',id:10},
{x:75,y:410,type:'rune',id:11},{x:330,y:440,type:'rune',id:12},{x:570,y:445,type:'rune',id:13},
{x:445,y:100,type:'bell',id:14},{x:700,y:90,type:'bell',id:15},
{x:300,y:330,type:'chest',id:16},{x:570,y:300,type:'chest',id:17},{x:115,y:240,type:'chest',id:18},{x:725,y:275,type:'chest',id:19},
{x:755,y:45,type:'portal',id:20}];
const coins=[[210,125],[260,130],[395,190],[620,160],[95,345],[500,420],[725,390],[375,300],[470,105],[685,250],[280,420],[590,240]].map((p,i)=>({x:p[0],y:p[1],id:i}));
const trees=[[65,70],[115,75],[215,75],[310,65],[585,55],[640,60],[75,205],[205,200],[625,265],[45,450],[180,445],[405,465],[515,450],[775,455],[765,150],[320,195]];
const rocks=[[355,65],[400,65],[505,65],[540,60],[425,260],[440,270],[460,265],[530,385],[540,395]];
function speak(t,slow=false){if(!('speechSynthesis'in window)){toast('Lyd er ikke tilgjengelig i denne nettleseren');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=slow?.7:.86;const voices=speechSynthesis.getVoices();const voice=voices.find(v=>v.lang==='en-GB')||voices.find(v=>v.lang.startsWith('en'));if(voice)u.voice=voice;speechSynthesis.speak(u)}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1800)}
function updateHud(){$('coinCount').textContent=state.coins;$('wordCount').textContent=state.found.length;$('keys').textContent='🔑 '+state.keys+'/3'}
function rounded(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function draw(){frame++;ctx.fillStyle='#91c981';ctx.fillRect(0,0,W,H);for(let x=13;x<W;x+=39)for(let y=10;y<H;y+=38){ctx.fillStyle=(x+y)%3?'#b0d999':'#bce3a5';ctx.fillRect(x,y,3,6)}
ctx.strokeStyle='#f3db9d';ctx.lineWidth=42;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(60,340);ctx.lineTo(150,290);ctx.lineTo(260,285);ctx.lineTo(360,210);ctx.lineTo(530,190);ctx.lineTo(740,58);ctx.stroke();ctx.strokeStyle='#f8e8b9';ctx.lineWidth=29;ctx.stroke();
rounded(350,0,62,185,0,'#6abbd5');for(let y=17;y<180;y+=26)rounded(346,y,70,8,0,'#ad8151');
for(const [x,y] of trees){rounded(x-4,y+13,8,22,2,'#8a613d');ctx.fillStyle='#367b53';ctx.beginPath();ctx.arc(x+4,y+4,21,0,7);ctx.fill();ctx.fillStyle='#51a467';ctx.beginPath();ctx.arc(x-4,y-5,15,0,7);ctx.fill()}
for(const [x,y] of rocks){rounded(x-8,y-5,19,15,4,'#84978b');rounded(x-7,y-6,14,6,3,'#a9b8a6')}
rounded(490,315,96,75,2,'#d7b98b');ctx.fillStyle='#a84f43';ctx.beginPath();ctx.moveTo(476,321);ctx.lineTo(540,276);ctx.lineTo(602,321);ctx.fill();rounded(530,351,22,39,1,'#76563e');
for(const c of coins){if(state.collected.includes(c.id))continue;ctx.fillStyle='#ffda59';ctx.beginPath();ctx.arc(c.x,c.y,10,0,7);ctx.fill();ctx.strokeStyle='#fff5ad';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#d5a02c';ctx.font='bold 13px system-ui';ctx.fillText('★',c.x-6,c.y+5)}
for(const o of objects){const complete=state.completed.includes(o.id);if(o.type==='chest'){rounded(o.x-17,o.y-11,34,28,2,complete?'#84694d':'#a86932');rounded(o.x-17,o.y-11,34,8,1,complete?'#a68c69':'#d49b4e');rounded(o.x-3,o.y-11,6,27,1,'#e5c05f')}else if(o.type==='crystal'){ctx.fillStyle=complete?'#a3c8c1':'#58c5ed';ctx.beginPath();ctx.moveTo(o.x,o.y-24);ctx.lineTo(o.x+16,o.y);ctx.lineTo(o.x,o.y+22);ctx.lineTo(o.x-16,o.y);ctx.fill()}else if(o.type==='rune'){rounded(o.x-15,o.y-23,30,42,6,complete?'#a1b5a4':'#8e7e9c');ctx.fillStyle='#f8df93';ctx.font='bold 23px serif';ctx.fillText('ᚱ',o.x-10,o.y+8)}else if(o.type==='bell'){ctx.font='32px system-ui';ctx.fillText('🔔',o.x-18,o.y+12)}else{rounded(o.x-23,o.y-26,46,52,6,state.keys>=3?'#8b6bce':'#82677b');ctx.font='26px system-ui';ctx.fillText(state.keys>=3?'🌀':'🔒',o.x-16,o.y+7)}if(!complete&&o.type!=='portal'){ctx.fillStyle='#fff6b0';ctx.font='bold 18px system-ui';ctx.fillText('!',o.x-3,o.y-26)}}
ctx.fillStyle='#e2ad49';ctx.beginPath();ctx.ellipse(player.x,player.y+15,14,5,0,0,7);ctx.fill();rounded(player.x-10,player.y-1,20,25,5,'#d95f83');rounded(player.x-8,player.y+19,6,10,1,'#334d8e');rounded(player.x+2,player.y+19,6,10,1,'#334d8e');ctx.fillStyle='#f4c79f';ctx.beginPath();ctx.arc(player.x,player.y-12,13,0,7);ctx.fill();ctx.fillStyle='#dca33c';ctx.beginPath();ctx.arc(player.x,player.y-18,13,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#2f3635';ctx.fillRect(player.x-5,player.y-12,2,2);ctx.fillRect(player.x+4,player.y-12,2,2);
if(near&&!modal){ctx.fillStyle='#fff8dc';ctx.font='bold 13px system-ui';const txt=near.type==='portal'?'Portal':near.type==='chest'?'Åpne kiste':'Undersøk';const tw=ctx.measureText(txt).width;rounded(player.x-tw/2-10,player.y-53,tw+20,23,8,'#fff9df');ctx.fillStyle='#315442';ctx.fillText(txt,player.x-tw/2,player.y-37)}requestAnimationFrame(draw)}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function refreshNear(){near=objects.filter(o=>distance(o,player)<53).sort((a,b)=>distance(a,player)-distance(b,player))[0]||null;const btn=$('interact');btn.disabled=!near;btn.textContent=!near?'✨ Åpne':near.type==='portal'?'🌀 Portal':'✨ Undersøk'}
function move(dx,dy){if(modal)return;const nx=Math.max(28,Math.min(W-28,player.x+dx)),ny=Math.max(30,Math.min(H-30,player.y+dy));if(!(nx>355&&nx<414&&ny<182)&&!(nx>486&&nx<594&&ny>313&&ny<394)){player.x=nx;player.y=ny}for(const c of coins)if(!state.collected.includes(c.id)&&distance(player,c)<23){state.collected.push(c.id);state.coins+=2;toast('🪙 +2 mynter!')}refreshNear();updateHud();save()}
let interval=null;const directions={up:[0,-10],down:[0,10],left:[-10,0],right:[10,0]};function startMove(dir){stopMove();const v=directions[dir];if(!v)return;move(...v);interval=setInterval(()=>move(...v),70)}function stopMove(){clearInterval(interval);interval=null}
document.querySelectorAll('[data-dir]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);startMove(b.dataset.dir)});['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,stopMove))});window.addEventListener('keydown',e=>{const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',a:'left',s:'down',d:'right'};if(map[e.key]&&!modal){e.preventDefault();keysDown.add(map[e.key]);move(...directions[map[e.key]])}if(e.key==='e'&&!modal)interact();if(e.key==='Escape'&&modal)closeModal()});
function openModal(title,html){modal=true;stopMove();$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('overlay').classList.add('show')}
function closeModal(){modal=false;challenge=null;$('overlay').classList.remove('show');$('modalBody').innerHTML='';refreshNear();save()}
$('closeModal').onclick=closeModal;$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeModal()});
function wordMastery(id){return state.mastery[id]||{translation:false,reverse:false,spelling:false,grammar:false,sentence:false,review:false}}
function stars(id){const m=wordMastery(id);return [m.translation,m.reverse,m.spelling,m.grammar,m.sentence&&m.review].filter(Boolean).length}
function gain(id,skill){const m=wordMastery(id);m[skill]=true;state.mastery[id]=m;save()}
function discover(id){if(!state.found.includes(id)){state.found.push(id);toast('📖 Nytt verb: '+VOCAB[id].w+'!')}updateHud();save()}
function opts(correct,pool,count=4){const arr=[correct,...pool.filter(x=>x!==correct).sort(()=>Math.random()-.5).slice(0,count-1)];return arr.sort(()=>Math.random()-.5)}
function challengeFor(o){const id=o.id%20,v=VOCAB[id];let type=o.type==='chest'?'translation':o.type==='crystal'?'grammar':o.type==='rune'?'spelling':'listening';return {id,type,v,obj:o}}
function interact(){if(!near)return;if(near.type==='portal'){if(state.keys<3){toast('🔒 Finn tre nøkkeldeler først!');return}openModal('🌀 Mesterportalen',`<p>Du har åpnet portalen! Finn flere verb og øv i ordboken for å samle alle 20.</p><div class="finish">🏆 ${state.found.length}/20 verb funnet</div><button class="primary" id="portalClose">Tilbake til eventyret</button>`);$('portalClose').onclick=closeModal;return}if(state.completed.includes(near.id)){toast('Allerede fullført! Finn neste utfordring.');return}challenge=challengeFor(near);showChallenge()}
$('interact').onclick=interact;
function showChallenge(){const {type,v}=challenge;answered=false;let title={translation:'🎁 Oppdag et verb',grammar:'💎 Grammatikk',spelling:'🪨 Stavemagi',listening:'🔔 Ekkoklokke'}[type];let question='',choices=null,correct='';if(type==='translation'){question='Hva betyr «'+v.w+'»?';correct=v.no;choices=opts(correct,VOCAB.map(w=>w.no))}else if(type==='grammar'){question='She ___ every day. ('+v.w+')';correct=v.third;choices=opts(correct,[v.w,v.w+'s',v.w+'es',v.w.replace(/y$/,'ies')].filter((x,i,a)=>a.indexOf(x)===i));if(choices.length<4)choices=opts(correct,[v.w,v.w+'s',v.w+'es',v.w+'ies','is'])}else if(type==='listening'){question='Lytt og velg norsk betydning';correct=v.no;choices=opts(correct,VOCAB.map(w=>w.no))}else{question='Skriv «'+v.no+'» på engelsk';correct=v.w}
challenge.correct=correct;openModal(title,`<div class="mini">${type==='listening'?'Trykk på høyttaleren. Ordet er skjult.':'Løs utfordringen for å samle verb og mynter.'}</div><div class="question" id="q">${question}</div>${type==='listening'?'<button class="primary" id="listenBtn">🔊 Spill av ordet</button>':''}${type==='spelling'?'<div class="entry"><input id="spellingInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Skriv på engelsk"><button class="secondary" id="checkSpelling">Sjekk</button></div>':'<div class="answers" id="answers"></div>'}<div class="feedback" id="feedback"></div><button class="primary hidden" id="continue">Tilbake til kartet →</button>`);
if(type==='listening')$('listenBtn').onclick=()=>speak(v.w);
if(choices){const a=$('answers');choices.forEach(option=>{const b=document.createElement('button');b.textContent=option;b.onclick=()=>submit(option,b);a.appendChild(b)})}else{$('checkSpelling').onclick=()=>submit($('spellingInput').value.trim().toLowerCase());$('spellingInput').addEventListener('keydown',e=>{if(e.key==='Enter')submit($('spellingInput').value.trim().toLowerCase())})}
$('continue').onclick=closeModal;
}
function submit(value,button){if(answered||!challenge)return;const {type,v,obj,correct}=challenge;const ok=value.toLowerCase()===correct.toLowerCase();if(button){button.classList.add(ok?'correct':'wrong');for(const b of $('answers').children)if(b.textContent===correct)b.classList.add('correct')}if(!ok){$('feedback').textContent='🙂 Prøv igjen!';if(type==='spelling')$('feedback').textContent='💡 Hint: '+correct[0]+'…';return}answered=true;$('feedback').textContent='🥳 Riktig! +10 mynter · '+v.w+' = '+v.no;state.coins+=10;discover(v.id);if(type==='translation'||type==='listening')gain(v.id,'translation');if(type==='spelling')gain(v.id,'spelling');if(type==='grammar')gain(v.id,'grammar');state.completed.push(obj.id);if(state.completed.length%6===0&&state.keys<3){state.keys++;toast('🔑 Du fant en nøkkeldel!')}updateHud();save();$('continue').classList.remove('hidden');if(type==='spelling'){$('spellingInput').disabled=true;$('checkSpelling').disabled=true}}
function openBook(selected){const n=state.found.length;openModal('📖 Min ordbok',`<div class="bookstats">${n} av 20 verb oppdaget · ${VOCAB.filter(v=>state.found.includes(v.id)&&stars(v.id)===5).length} mestret</div><div class="progress"><span style="width:${n/20*100}%"></span></div><div class="bookgrid" id="bookgrid"></div><div class="detail" id="detail"></div>`);renderBook(selected??state.found[0]??null)}
$('bookButton').onclick=()=>openBook();
function renderBook(selected){if(!$('bookgrid'))return;const grid=$('bookgrid');grid.innerHTML='';for(const v of VOCAB){const found=state.found.includes(v.id);const b=document.createElement('button');b.className='wordtile'+(!found?' locked':'')+(v.id===selected?' active':'');b.innerHTML=`<b>${found?v.w:'🔒 ???'}</b><span class="stars">${found?'★'.repeat(stars(v.id))+'☆'.repeat(5-stars(v.id)):'Ukjent'}</span>`;b.onclick=()=>renderBook(v.id);grid.appendChild(b)}const detail=$('detail');if(selected===null||!state.found.includes(selected)){detail.innerHTML='<p>Finn verb i skattekistene og utfordringene for å fylle boken! 📖</p>';return}const v=VOCAB[selected],m=wordMastery(selected);detail.innerHTML=`<h3>to ${v.w} <span class="stars">${'★'.repeat(stars(v.id))}${'☆'.repeat(5-stars(v.id))}</span></h3><div>${v.no} · he/she/it: <b>${v.third}</b></div><div class="example">${v.sentence}</div><div class="muted">${v.nor}</div><div class="line"><button id="hearWord">🔊 Ord</button><button id="hearSentence">🔊 Setning</button><button id="practiceWord">🎯 Øv på ordet</button></div><div class="muted">${['Forstå','Oversette','Stave','Bøye','Setning + repetisjon'].map((x,i)=>([m.translation,m.reverse,m.spelling,m.grammar,m.sentence&&m.review][i]?'✓ ':'○ ')+x).join(' · ')}</div>`;$('hearWord').onclick=()=>speak(v.w);$('hearSentence').onclick=()=>speak(v.sentence);$('practiceWord').onclick=()=>practice(v.id)}
function practice(id){const v=VOCAB[id],m=wordMastery(id);const skills=['translation','reverse','spelling','grammar','sentence'];const skill=skills.find(s=>!m[s])||skills[Math.floor(Math.random()*skills.length)];let prompt='',options=[],correct='';if(skill==='translation'){prompt='Hva betyr «'+v.w+'»?';correct=v.no;options=opts(correct,VOCAB.map(x=>x.no))}else if(skill==='reverse'){prompt='Hva heter «'+v.no+'» på engelsk?';correct=v.w;options=opts(correct,VOCAB.map(x=>x.w))}else if(skill==='spelling'){prompt='Skriv «'+v.no+'» på engelsk';correct=v.w}else if(skill==='grammar'){prompt='Hva blir «'+v.w+'» med he/she/it?';correct=v.third;options=opts(correct,[v.w,v.w+'s',v.w+'es',v.w.replace(/y$/,'ies'),'has','is'])}else{prompt='Er setningen riktig? «'+v.sentence+'»';correct='Riktig';options=['Riktig','Feil']}
const html=`<div class="question">${prompt}</div>${skill==='spelling'?'<div class="entry"><input id="practiceInput" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="practiceCheck" class="secondary">Sjekk</button></div>':'<div class="answers" id="practiceAnswers"></div>'}<div class="feedback" id="practiceFeedback"></div><button class="primary hidden" id="backBook">Til ordboken →</button>`;openModal('🎯 Øv på: '+v.w,html);let done=false;const check=(answer,button)=>{if(done)return;const ok=answer.trim().toLowerCase()===correct.toLowerCase();if(button){button.classList.add(ok?'correct':'wrong');for(const b of $('practiceAnswers').children)if(b.textContent===correct)b.classList.add('correct')}if(!ok){$('practiceFeedback').textContent='🙂 Prøv igjen';return}done=true;$('practiceFeedback').textContent='🥳 Riktig!';gain(id,skill);if(skill==='sentence'){gain(id,'review')}state.coins+=3;updateHud();save();$('backBook').classList.remove('hidden')};if(skill==='spelling'){$('practiceCheck').onclick=()=>check($('practiceInput').value);$('practiceInput').addEventListener('keydown',e=>{if(e.key==='Enter')check($('practiceInput').value)})}else{const a=$('practiceAnswers');options.forEach(o=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>check(o,b);a.appendChild(b)})}$('backBook').onclick=()=>openBook(id)}
updateHud();refreshNear();draw();
})();
</script></body></html>
