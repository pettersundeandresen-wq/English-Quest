<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>English Quest - demo</title><style>
*{box-sizing:border-box}body{margin:0;background:#152b32;color:#fff;font-family:system-ui,-apple-system,sans-serif}main{max-width:760px;margin:auto;padding:10px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.top b{font-size:19px}.stats{font-weight:700;color:#ffe18b}canvas{display:block;width:100%;aspect-ratio:16/11;border:3px solid #547b63;border-radius:15px;background:#8fc67c;image-rendering:pixelated;touch-action:none}.hint{font-size:12px;color:#d6e4e2;text-align:center;margin:7px 0}.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px}.pad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,43px);gap:3px;touch-action:none}.pad button{border:0;border-radius:10px;background:#d4e9de;color:#123c37;font-size:22px;font-weight:800;touch-action:none}.pad button:active{background:#ffdc7c}.pad .up{grid-column:2;grid-row:1}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:3}.pad .right{grid-column:3;grid-row:2}.action{background:#ffd568;color:#463208;border:0;border-radius:14px;font-weight:800;font-size:17px;min-height:65px;padding:12px 22px}.action:disabled{opacity:.45}.msg{font-size:13px;color:#d4eee2;max-width:220px}.overlay{position:fixed;inset:0;background:#08191dd9;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.overlay.show{display:flex}.panel{width:min(100%,440px);background:#fff9e9;color:#283c35;border-radius:20px;padding:22px;text-align:center;box-shadow:0 16px 50px #0005}.panel h2{margin:0 0 8px}.panel p{margin:10px 0 18px;font-size:19px;font-weight:650}.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}.answers button,.next{border:2px solid #d4dfd2;background:#edf5e9;color:#254333;padding:14px 6px;border-radius:12px;font-weight:750;font-size:17px}.answers button.correct{background:#b4e8c2;border-color:#16834b}.answers button.wrong{background:#ffd1cb;border-color:#c94e43}.next{background:#ffcf62;border:0;width:100%;margin-top:12px}.feedback{min-height:28px;font-weight:700;margin-top:12px}.small{font-size:12px;color:#6a796e}@media(max-width:410px){main{padding:7px}.pad{grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,40px)}.action{padding:9px;font-size:15px}.msg{font-size:12px}}
</style></head><body><main><div class="top"><b>🗺️ English Quest</b><div class="stats">🪙 <span id="coins">0</span> &nbsp; 🔑 <span id="keys">0</span>/3</div></div><canvas id="game" width="640" height="440" aria-label="Eventyrkart med figur, kister og en låst port"></canvas><div class="hint">Gå til en kiste og trykk ÅPNE · piltaster/WASD på PC</div><div class="bottom"><div class="pad"><button class="up" data-dir="up" aria-label="Opp">▲</button><button class="left" data-dir="left" aria-label="Venstre">◀</button><button class="down" data-dir="down" aria-label="Ned">▼</button><button class="right" data-dir="right" aria-label="Høyre">▶</button></div><div class="msg" id="message">Finn tre nøkkeldeler i skattekistene!</div><button class="action" id="interact">ÅPNE ✨</button></div></main><div class="overlay" id="overlay"><div class="panel"><h2 id="quizTitle">Skattekiste!</h2><p id="question"></p><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="next" id="continue" hidden>Fortsett eventyret →</button><div class="small">Du kan alltid prøve igjen. Ingen tidspress!</div></div></div><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');const $=id=>document.getElementById(id);const W=640,H=440;let coins=0,keys=0,active=null,finished=false;const player={x:72,y:300};const obstacles=[{x:0,y:0,w:640,h:22},{x:0,y:418,w:640,h:22},{x:0,y:0,w:22,h:440},{x:618,y:0,w:22,h:440},{x:265,y:24,w:65,h:126},{x:378,y:290,w:105,h:55}];const chests=[{x:116,y:125,opened:false,q:'Hva betyr «swim»?',a:['løpe','svømme','sove','hoppe'],correct:1},{x:455,y:110,opened:false,q:'Hva er riktig med «she»?',a:['she play','she plays','she playing','she plaies'],correct:1},{x:225,y:345,opened:false,q:'Hva betyr «carry»?',a:['gråte','synge','bære','kjøpe'],correct:2},{x:530,y:340,opened:false,q:'Hvilken setning er riktig?',a:['He can runs.','He can run.','He cans run.','He run can.'],correct:1},{x:355,y:208,opened:false,q:'Hva betyr «watch»?',a:['se på','vaske','vente','gå'],correct:0}];const collectibles=[{x:192,y:100,got:false},{x:340,y:362,got:false},{x:550,y:185,got:false},{x:93,y:372,got:false},{x:491,y:238,got:false}];const gate={x:575,y:52};const trees=[[38,66],[77,52],[180,44],[226,72],[350,42],[406,55],[595,170],[582,277],[56,200],[150,225],[301,390],[510,396],[410,389]];const pressed=new Set();function near(a,b,r=48){return Math.hypot(a.x-b.x,a.y-b.y)<r}function block(x,y){return obstacles.some(o=>x>o.x-13&&x<o.x+o.w+13&&y>o.y-13&&y<o.y+o.h+13)||trees.some(t=>Math.hypot(x-t[0],y-t[1])<23)}function update(dt){if(active||finished)return;let dx=(pressed.has('right')?1:0)-(pressed.has('left')?1:0),dy=(pressed.has('down')?1:0)-(pressed.has('up')?1:0);if(dx||dy){let m=Math.hypot(dx,dy),s=Math.min(dt,0.04)*140;dx=dx/m*s;dy=dy/m*s;if(!block(player.x+dx,player.y))player.x+=dx;if(!block(player.x,player.y+dy))player.y+=dy}for(const c of collectibles)if(!c.got&&near(player,c,22)){c.got=true;coins+=3;$('coins').textContent=coins}if(keys===3&&near(player,gate,39)){finished=true;$('message').textContent='🏆 Du åpnet porten! Eventyret er fullført.';$('interact').textContent='Spill igjen';$('interact').disabled=false}}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#8dc779';ctx.fillRect(0,0,W,H);ctx.fillStyle='#a7d990';for(let x=25;x<W;x+=46)for(let y=35;y<H;y+=43){ctx.fillRect(x+((y*3)%17),y,3,5)}ctx.strokeStyle='#dec795';ctx.lineWidth=47;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(55,300);ctx.lineTo(140,280);ctx.lineTo(215,210);ctx.lineTo(420,200);ctx.lineTo(568,84);ctx.stroke();ctx.strokeStyle='#f1dca8';ctx.lineWidth=36;ctx.stroke();ctx.fillStyle='#70b9df';ctx.fillRect(280,22,38,128);ctx.fillStyle='#c49b65';for(let i=0;i<5;i++)ctx.fillRect(277,49+i*16,44,8);ctx.fillStyle='#cbb08a';ctx.fillRect(378,290,105,55);ctx.fillStyle='#a04f42';ctx.beginPath();ctx.moveTo(366,295);ctx.lineTo(431,250);ctx.lineTo(495,295);ctx.fill();ctx.fillStyle='#6d533f';ctx.fillRect(420,310,19,35);for(const t of trees){ctx.fillStyle='#785738';ctx.fillRect(t[0]-4,t[1]+7,8,20);ctx.fillStyle='#397e4b';ctx.beginPath();ctx.arc(t[0],t[1],19,0,7);ctx.fill();ctx.fillStyle='#4c9c5b';ctx.beginPath();ctx.arc(t[0]-6,t[1]-5,12,0,7);ctx.fill()}for(const c of collectibles)if(!c.got){ctx.fillStyle='#f6c83d';ctx.beginPath();ctx.arc(c.x,c.y,9,0,7);ctx.fill();ctx.strokeStyle='#fff0a8';ctx.lineWidth=2;ctx.stroke()}for(const c of chests){ctx.fillStyle=c.opened?'#73563b':'#a66c35';ctx.fillRect(c.x-16,c.y-10,32,24);ctx.fillStyle=c.opened?'#4b3827':'#f4ce55';ctx.fillRect(c.x-3,c.y-10,6,24);ctx.strokeStyle='#4d3929';ctx.lineWidth=3;ctx.strokeRect(c.x-16,c.y-10,32,24);if(!c.opened){ctx.fillStyle='#fff6bd';ctx.font='bold 17px system-ui';ctx.fillText('!',c.x-3,c.y-20)}}ctx.fillStyle=keys===3?'#5dcf9c':'#8a6d78';ctx.fillRect(gate.x-20,gate.y-15,40,48);ctx.fillStyle='#f9e5a2';ctx.font='bold 19px system-ui';ctx.fillText(keys===3?'✓':'🔒',gate.x-11,gate.y+15);ctx.fillStyle='#f4cda9';ctx.beginPath();ctx.arc(player.x,player.y-13,12,0,7);ctx.fill();ctx.fillStyle='#d1a03e';ctx.beginPath();ctx.arc(player.x,player.y-19,13,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#de6888';ctx.fillRect(player.x-10,player.y-1,20,21);ctx.fillStyle='#3b5488';ctx.fillRect(player.x-9,player.y+19,7,10);ctx.fillRect(player.x+3,player.y+19,7,10);ctx.fillStyle='#302a26';ctx.fillRect(player.x-5,player.y-14,2,2);ctx.fillRect(player.x+5,player.y-14,2,2);if(!finished){const n=chests.find(c=>!c.opened&&near(player,c));$('interact').disabled=!n;$('interact').textContent=n?'ÅPNE ✨':'Gå til kiste';$('message').textContent=n?'En kiste! Løs en oppgave.':keys===3?'Finn den åpne porten!':'Finn tre nøkkeldeler i skattekistene!'}}let last=performance.now();function frame(t){update((t-last)/1000);last=t;draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);function interact(){if(finished){location.reload();return}const c=chests.find(c=>!c.opened&&near(player,c));if(!c)return;active=c;$('overlay').classList.add('show');$('quizTitle').textContent='🧰 Skattekiste';$('question').textContent=c.q;$('feedback').textContent='';$('continue').hidden=true;$('answers').innerHTML='';c.a.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s;b.addEventListener('click',()=>{const good=i===c.correct;b.classList.add(good?'correct':'wrong');if(!good){$('feedback').textContent='🙂 Prøv igjen!';return}c.opened=true;coins+=10;$('coins').textContent=coins;if(keys<3){keys++;$('keys').textContent=keys;$('feedback').textContent='🥳 Riktig! +10 mynter og en nøkkeldel!'}else $('feedback').textContent='🥳 Riktig! +10 mynter!';Array.from($('answers').children).forEach(x=>x.disabled=true);$('continue').hidden=false});$('answers').appendChild(b)})} $('interact').addEventListener('click',interact);$('continue').addEventListener('click',()=>{$('overlay').classList.remove('show');active=null});const dirs={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',a:'left',s:'down',d:'right'};document.addEventListener('keydown',e=>{if(dirs[e.key]){e.preventDefault();pressed.add(dirs[e.key])}if((e.key===' '||e.key==='Enter')&&!active){e.preventDefault();interact()}});document.addEventListener('keyup',e=>{if(dirs[e.key])pressed.delete(dirs[e.key])});document.querySelectorAll('[data-dir]').forEach(b=>{let d=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);pressed.add(d)});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>pressed.delete(d))});canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;const c=chests.find(c=>!c.opened&&Math.hypot(c.x-x,c.y-y)<24&&near(player,c));if(c)interact()});})();
</script></body></html>
